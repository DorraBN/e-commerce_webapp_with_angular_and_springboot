<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Form</title>
  <style>
    .input-container {
      position: relative;
      margin-bottom: 20px;
    }
    .input, .textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    .submit {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background-color: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    select.input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <main>
    <div class="form">
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="input-container">
          <input id="nom" name="nom" class="input" formControlName="nom" type="text" placeholder="Name" required />
        </div>
        
        <div class="input-container">
          <input id="categorie" name="categorie" class="input" formControlName="categorie" type="text" placeholder="Category" required />
        </div>

        <div class="input-container">
          <input id="stock" name="stock" class="input" formControlName="stock" type="number" placeholder="Stock" required />
        </div>

        <div class="input-container">
          <label for="disponible">Available</label>
          <select id="disponible" name="disponible" class="input" formControlName="disponible" required>
            <option value="" disabled>Select Availability</option>
            <option value="true">Yes</option>
            <option value="false">No</option>
          </select>
        </div>
        <br>

        <div>
          <label for="image">Product Image:</label>
          <input type="file" (change)="onFileChange($event)" formControlName="url_image"  />
        </div>

        <div class="input-container">
          <input id="prix" name="prix" class="input" type="number" step="0.01" formControlName="prix" placeholder="Price" required />
        </div> 

        <div class="input-container">
          <textarea id="description" name="description" class="textarea" rows="2" formControlName="description" placeholder="Description" required></textarea>
        </div>

        <button type="submit" class="submit">Submit</button>
      </form>
    </div>
  </main>

</body>
</html>
